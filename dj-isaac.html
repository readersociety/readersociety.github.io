<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ</title>

  <!-- CSS -->
  <link rel="stylesheet" href="dj.css">
</head>
<body>
  <div id="gradient-bg"></div>

<!--- ====================== VERLAY =============== --->
  <!-- NOW PLAYING OVERLAY -->
<div id="overlay" class="overlay hidden">
  <div class="overlay-header">
    <button id="closeOverlay" class="icon-btn">
      ⬇
    </button>
    <span class="overlay-title">Now Playing</span>
    <button class="icon-btn">⋮</button>
  </div>

  <div class="overlay-content">
    <img id="overlayCover" class="overlay-cover" src="" alt="cover" />

    <div class="overlay-info">
      <h2 id="overlaySongTitle"></h2>
      <p id="overlayArtist"></p>
    </div>

   <!-- WAVEFORM -->
<div id="waveform" class="waveform"></div>

<div class="time-row">
  <span id="currentTime">0:00</span>
  <span id="duration">0:00</span>
</div>


    <!-- Main Controls -->
    <div class="controls">
      <button class="icon-btn" id="back10">⟲10</button>
      <button class="icon-btn" id="prev"><!-- PREV -->
<svg class="icon" viewBox="0 0 24 24">
  <polygon points="19 4 9 12 19 20"></polygon>
  <line x1="5" y1="5" x2="5" y2="19"></line>
</svg>
</button>
      <button class="icon-btn big" id="playPause"><svg class="icon" viewBox="0 0 24 24">
  <polygon points="5 3 19 12 5 21"></polygon>
</svg>
</button>
      <button class="icon-btn" id="next"><!-- NEXT -->
<svg class="icon" viewBox="0 0 24 24">
  <polygon points="5 4 15 12 5 20"></polygon>
  <line x1="19" y1="5" x2="19" y2="19"></line>
</svg>
</button>
      <button class="icon-btn" id="forward10">10⟳</button>
    </div>

    <!-- Secondary Controls -->
    <div class="secondary-controls">
      <button id="likeBtn" class="icon-btn">♡</button>
      <button id="lyricsBtn" class="icon-btn">📄</button>
      <button id="repeatBtn" class="icon-btn">🔁</button>
    </div>

    <!-- Lyrics -->
    <div id="lyricsPanel" class="lyrics hidden"></div>
  </div>
</div>

  <!-- MINI PLAYER -->
<div id="miniPlayer" class="mini-player hidden">
  <div class="mini-left">
    <img id="miniCover" src="" alt="cover">
    <div class="mini-info">
      <span id="miniTitle"></span>
      <span id="miniArtist"></span>
    </div>
  </div>

  <button id="miniPlayPause" class="icon-btn big"><svg class="icon" viewBox="0 0 24 24">
  <polygon points="5 3 19 12 5 21"></polygon>
</svg>
</button>
</div>

  <!-- ================= TOP BAR ================= -->
  <header class="topbar">
    <button class="hamburger" id="openSidebar">☰</button>
    <h1 class="logo">DJ</h1>
    <button class="theme-toggle" id="toggleTheme">🌙</button>

    <a class="nav-link active" data-section="home">Home</a>
<a class="nav-link" data-section="library">Library</a>
<a class="nav-link" data-section="liked">Liked</a>
    <a class="nav-link" data-section="playlists">Playlists</a>
<a class="nav-link" data-section="settings">Settings</a>
<div class="search-bar">
  <input
    id="searchInput"
    type="text"
    placeholder="Search songs, artists, lyrics…"
  />
</div>
<div class="search-filters">
  <button onclick="showMostPlayed()">🔥 Most Played</button>
  <button onclick="showRecentlyPlayed()">🕒 Recent</button>
  <button onclick="showLikedSongs()">❤️ Liked</button>
</div>

  </header>

<section id="home" class="section active"></section>
  
<section id="library" class="section"></section>
  
<section id="liked" class="section">
  <button id="playLiked"><svg class="icon" viewBox="0 0 24 24">
  <polygon points="5 3 19 12 5 21"></polygon>
</svg>
 Play All</button>
<div class="song-list"></div>

</section>
<section id="playlists" class="section">
  <h2>Your Playlists</h2>

  <div class="create-playlist">
    <input id="playlistName" placeholder="New playlist name">
    <button id="createPlaylist">Create</button>
  </div>

  <div id="playlistList"></div>
</section>

<section id="settings" class="section"></section>

</body>
</html>
