<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DJ Music</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />

  <!-- CSS -->
  <link rel="stylesheet" href="dj.css" />
</head>

<body>

  <!-- 🌈 Animated Gradient Background -->
  <div id="gradient-bg"></div>

  <!-- 🍔 TOP BAR -->
  <header class="top-bar">
    <button class="hamburger" onclick="toggleMenu()">☰</button>

    <div class="search-bar">
      <input
        id="searchInput"
        type="text"
        placeholder="Search songs, artists, lyrics…"
      />
    </div>
  </header>

  <!-- 🧭 SIDE / MOBILE NAV -->
  <nav id="sideNav" class="side-nav">
    <button class="nav-link active" onclick="switchSection('home')">🏠 Home</button>
    <button class="nav-link" onclick="switchSection('liked')">❤️ Liked</button>
    <button class="nav-link" onclick="switchSection('playlists')">📂 Playlists</button>
    <button class="nav-link" onclick="switchSection('search')">🔍 Search</button>
  </nav>

  <!-- 📄 MAIN CONTENT -->
  <main>

    <!-- 🏠 HOME -->
    <section id="home" class="section active">
      <h2 class="welcome">Welcome back 🎧</h2>

      <div class="song-list" id="homeSongs">
        <!-- Songs injected by JS -->
      </div>
    </section>

    <!-- ❤️ LIKED -->
    <section id="liked" class="section">
      <h2 class="welcome">Your favorite vibes ❤️</h2>

      <div class="song-list" id="likedSongs"></div>
    </section>

    <!-- 📂 PLAYLISTS -->
    <section id="playlists" class="section">
      <h2 class="welcome">Your sound, your way 🎶</h2>

      <div class="playlist-actions">
        <button onclick="createPlaylist()">＋ New Playlist</button>
      </div>

      <div class="playlist-list" id="playlistList"></div>
    </section>

    <!-- 🔍 SEARCH -->
    <section id="search" class="section">
      <h2 class="welcome">Find your next obsession 🔍</h2>

      <div class="song-list" id="searchResults"></div>
    </section>

  </main>

  <!-- 🎧 MINI PLAYER (GLOBAL) -->
  <div id="miniPlayer" class="mini-player">
    <img class="cover" src="" alt="cover" />

    <div class="info">
      <div class="title">Song title</div>
      <div class="artist">Artist</div>
    </div>

    <button onclick="togglePlay()">▶</button>
  </div>

  <!-- 🎶 FULL PLAYER OVERLAY -->
  <div id="overlay" class="player-overlay">

    <button class="close-btn" onclick="closeOverlay()">✕</button>

    <img class="cover-large" src="" alt="cover" />

    <h3 class="title">Song title</h3>
    <p class="artist">Artist</p>

    <!-- 🌊 WAVEFORM -->
    <div id="waveform" class="waveform"></div>

    <div class="time-row">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <!-- 🎛 CONTROLS -->
    <div class="controls">
      <button onclick="skip(-10)">⏪</button>
      <button onclick="togglePlay()">⏯</button>
      <button onclick="skip(10)">⏩</button>
    </div>

    <!-- 🔁 EXTRA CONTROLS -->
    <div class="extra-controls">
      <button onclick="toggleLike()">❤️</button>
      <button onclick="toggleRepeat()">🔁</button>
      <button onclick="toggleBass()">🎚 Bass</button>
      <button onclick="toggleTreble()">🎚 Treble</button>
    </div>

    <!-- 📜 LYRICS -->
    <div class="lyrics">
      <p>Select a song to see lyrics 🎶</p>
    </div>

  </div>

  <!-- JS -->
  <script src="dj.js"></script>

</body>
</html>
