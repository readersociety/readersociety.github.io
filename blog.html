	<script>
	// Sample data; replace with your posts
	const POSTS = [
		{
			id: "stargazing-night",
			title: "First Meet - Noa's Pick",
			date: "2025-10-09",
			tags: ["awkward", "brave", "crush", "first meet", "Noa's House", "Games"],
			summary: "Where our shyness dissolved and we got to know each other. We also literally spent 5 minutes out of 5 hours being a book club :D.",
			cover: "https://github.com/readersociety/readersociety.github.io/blob/main/Noa%20_Yumi.JPG?raw=true",
			section: "2025-10"
		},
		{
			id: "hackathon-48",
			title: "Second Meet - Claudia's Pick",
			date: "2025-11-06",
			tags: ["Land of stories", "Mafia", "New Member", "Deep Revelations"],
			summary: "We got to know each other more in this meet thanks to the discussion questions. This time, we spent almost all out time chatting and playing games - especially  Mafia.",
			cover: "https://github.com/readersociety/readersociety.github.io/blob/main/Nov6_Books.JPG?raw=true",
			section: "2025-11"
		}
	];

	document.getElementById("year").textContent = new Date().getFullYear();

	function monthLabel(ym) {
		const [y, m] = ym.split("-").map(Number);
		const dt = new Date(y, m - 1, 1);
		return dt.toLocaleString(undefined, { month: "long", year: "numeric" });
	}

	// tags
	const allTags = Array.from(new Set(POSTS.flatMap(p => p.tags))).sort();
	const tagSelect = document.getElementById("tag");
	allTags.forEach(t => {
		const opt = document.createElement("option");
		opt.value = t; opt.textContent = t; tagSelect.appendChild(opt);
	});

	function groupBySection(items) {
		const map = new Map();
		items.forEach(p => {
			if (!map.has(p.section)) map.set(p.section, []);
			map.get(p.section).push(p);
		});
		return Array.from(map.entries()).sort((a, b) => b[0].localeCompare(a[0]));
	}

	const sectionsEl = document.getElementById("sections");

	function renderSections(items) {
		sectionsEl.innerHTML = "";
		const groups = groupBySection(items);
		groups.forEach(([sec, posts]) => {
			posts.sort((a, b) => b.date.localeCompare(a.date));
			const secEl = document.createElement("section");
			secEl.className = "event-section";
			secEl.innerHTML = `
				<div class="section-header">
					<div class="section-count">${posts.length} entr${posts.length === 1 ? "y" : "ies"}</div>
				</div>
				<div class="card-grid"></div>
			`;
			const grid = secEl.querySelector(".card-grid");

			posts.forEach(p => {
				const card = document.createElement("a");
				card.className = "card";
				card.href = "blog/" + encodeURIComponent(p.id) + ".html"; // Option A direct file
				card.innerHTML = `
					<div class="card-cover" style="background-image:url('${p.cover}')"></div>
					<div class="card-body">
						<h4>${p.title}</h4>
						<p class="muted">${new Date(p.date).toLocaleDateString()}</p>
						<p>${p.summary}</p>
						<div class="tags">
							${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}
						</div>
					</div>
				`;
				grid.appendChild(card);
			});

			sectionsEl.appendChild(secEl);
		});
		if (!groups.length) {
			sectionsEl.innerHTML = `<div class="constitution-section" style="text-align:center;">No results. Try different dates or tags.</div>`;
		}
	}

	function applyFilters() {
		const q = document.getElementById("q").value.trim().toLowerCase();
		const tag = document.getElementById("tag").value;
		const from = document.getElementById("from").value;
		const to = document.getElementById("to").value;

		const out = POSTS.filter(p => {
			const qHit = !q || p.title.toLowerCase().includes(q) || p.summary.toLowerCase().includes(q);
			const tagHit = !tag || p.tags.includes(tag);
			const dateHit = (!from || p.date >= from) && (!to || p.date <= to);
			return qHit && tagHit && dateHit;
		});

		const info = document.getElementById("resultsInfo");
		info.hidden = false;
		info.textContent = `Showing ${out.length} of ${POSTS.length} entries`;
		renderSections(out);
	}

	document.getElementById("searchForm").addEventListener("submit", e => {
		e.preventDefault(); applyFilters();
	});
	document.getElementById("clearBtn").addEventListener("click", () => {
		document.getElementById("q").value = "";
		document.getElementById("tag").value = "";
		document.getElementById("from").value = "";
		document.getElementById("to").value = "";
		applyFilters();
	});
	window.addEventListener("keydown", e => {
		if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
			e.preventDefault(); document.getElementById("q").focus();
		}
	});

	applyFilters();
	</script>
<script>
    // --- Global Variables (Declared once) ---
    const header = document.querySelector("header");
    const body = document.body;
    const toggle = document.getElementById('menu-toggle');
    const navLinks = document.getElementById('nav-links');

    // --- Navbar Scroll Effect ---
    window.addEventListener("scroll", () => {
        header.classList.toggle("scrolled", window.scrollY > 50);
        body.classList.toggle("scrolled", window.scrollY > 100);
    });

    // --- Mobile Menu Toggle ---
    if (toggle) {
        toggle.addEventListener('click', () => {
            toggle.classList.toggle('active');
            navLinks.classList.toggle('active');
        });
    }

    // --- Section Reveal Animation (Your first observer script) ---
    const sectionObserver = new IntersectionObserver(entries => { // Renamed to sectionObserver
        entries.forEach(e => {
            if (e.isIntersecting) {
                e.target.classList.add("in-view");
                sectionObserver.unobserve(e.target); // Use the renamed observer here
            }
        });
    }, { threshold: 0.2 });
    document.querySelectorAll("section").forEach(sec => sectionObserver.observe(sec));


    // --- Lenis Smooth Scroll & Fade-In Observer (Initialized on DOM Load) ---
    document.addEventListener('DOMContentLoaded', () => {
        const lenis = new Lenis({
            lerp: 0.05,
            wheelMultiplier: 0.8,
            duration: 1.5,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
        });

        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        // Intersection Observer for fade-in effects on scroll (using 'show' class)
        const observerOptions = { root: null, rootMargin: '0px', threshold: 0.2 };
        const fadeInObserver = new IntersectionObserver((entries, observer) => { // Renamed to fadeInObserver
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('show');
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);
        document.querySelectorAll('.fade-in').forEach(el => {
            fadeInObserver.observe(el);
        });
    });

</script>
