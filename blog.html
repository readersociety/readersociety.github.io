<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Club Blog Editor</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    textarea { width: 100%; height: 300px; margin-bottom: 20px; }
    button { padding: 10px 20px; font-size: 16px; }
    #status { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Book Club Blog Editor</h1>
  <textarea id="postContent" placeholder="Write your post here..."></textarea>
  <br>
  <button id="uploadBtn">Upload Post</button>
  <div id="status"></div>

  <script>
    const token = "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"; // Replace with your token
    const owner = "readersociety";       // Replace with your GitHub username
    const repo = "readersociety.github.io";              // Replace with your repo name

    document.getElementById("uploadBtn").addEventListener("click", () => {
      const contentRaw = document.getElementById("postContent").value;
      if (!contentRaw) {
        document.getElementById("status").innerText = "Please write something first!";
        return;
      }

      // Encode content in Base64
      const content = btoa(unescape(encodeURIComponent(contentRaw)));

      // Create a filename based on timestamp
      const filename = `posts/post-${Date.now()}.md`;

      fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filename}`, {
        method: "PUT",
        headers: {
          "Authorization": `token ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: "New blog post",
          content: content
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.content) {
          document.getElementById("status").innerText = "✅ Post published successfully!";
        } else {
          document.getElementById("status").innerText = "❌ Error: " + (data.message || "Unknown error");
        }
      })
      .catch(err => {
        document.getElementById("status").innerText = "❌ Request failed: " + err;
      });
    });
  </script>
</body>
</html>
