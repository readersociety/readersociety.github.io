<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Reader Society — Events & Stories</title>
	<link rel="stylesheet" href="readersociety.css" />
</head>
<body>
	<header class="site-header">
		<div class="container brand">
			<div class="logo-dot"></div>
			<h1>Events & Stories</h1>
		</div>
	</header>

	<main class="container">
		<section class="hero-strip">
			<h2>Latest Highlights</h2>
			<p class="muted" style="text-align:center;max-width:760px;margin:8px auto 0;">
				Browse events by month, filter by tags, or jump in via search.
			</p>

			<form id="searchForm" class="search">
				<div class="search-row">
					<input id="q" type="search" placeholder="Search title or summary…  Press / to focus" autocomplete="off" />
					<select id="tag">
						<option value="">All tags</option>
					</select>
					<input id="from" type="date" />
					<input id="to" type="date" />
					<button type="submit">Search</button>
					<button type="button" id="clearBtn" class="ghost">Clear</button>
				</div>
			</form>
		</section>

		<section id="resultsInfo" class="results-info muted" hidden></section>
		<div id="sections" class="sections"></div>
	</main>

	<footer class="container" style="text-align:center;margin:40px 0 60px;color:var(--muted);">
		© <span id="year"></span> Reader Society
	</footer>

	<script>
	// Sample data; replace with your posts
	const POSTS = [
		{
			id: "stargazing-night",
			title: "Stargazing Night",
			date: "2025-10-12",
			tags: ["astronomy", "outdoors"],
			summary: "We hiked to the ridge and caught the Orionid meteors under clear skies.",
			cover: "https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3",
			section: "2025-10"
		},
		{
			id: "hackathon-48",
			title: "Hackathon 48",
			date: "2025-09-20",
			tags: ["coding", "teamwork"],
			summary: "Built a tag-based search engine with live previews.",
			cover: "https://images.unsplash.com/photo-1522071820081-009f0129c71c",
			section: "2025-09"
		}
	];

	document.getElementById("year").textContent = new Date().getFullYear();

	function monthLabel(ym) {
		const [y, m] = ym.split("-").map(Number);
		const dt = new Date(y, m - 1, 1);
		return dt.toLocaleString(undefined, { month: "long", year: "numeric" });
	}

	// tags
	const allTags = Array.from(new Set(POSTS.flatMap(p => p.tags))).sort();
	const tagSelect = document.getElementById("tag");
	allTags.forEach(t => {
		const opt = document.createElement("option");
		opt.value = t; opt.textContent = t; tagSelect.appendChild(opt);
	});

	function groupBySection(items) {
		const map = new Map();
		items.forEach(p => {
			if (!map.has(p.section)) map.set(p.section, []);
			map.get(p.section).push(p);
		});
		return Array.from(map.entries()).sort((a, b) => b[0].localeCompare(a[0]));
	}

	const sectionsEl = document.getElementById("sections");

	function renderSections(items) {
		sectionsEl.innerHTML = "";
		const groups = groupBySection(items);
		groups.forEach(([sec, posts]) => {
			posts.sort((a, b) => b.date.localeCompare(a.date));
			const secEl = document.createElement("section");
			secEl.className = "event-section";
			secEl.innerHTML = `
				<div class="section-header">
					<h3>${monthLabel(sec)}</h3>
					<div class="section-count">${posts.length} entr${posts.length === 1 ? "y" : "ies"}</div>
				</div>
				<div class="card-grid"></div>
			`;
			const grid = secEl.querySelector(".card-grid");

			posts.forEach(p => {
				const card = document.createElement("a");
				card.className = "card";
				card.href = "posts/" + encodeURIComponent(p.id) + ".html"; // Option A direct file
				card.innerHTML = `
					<div class="card-cover" style="background-image:url('${p.cover}')"></div>
					<div class="card-body">
						<h4>${p.title}</h4>
						<p class="muted">${new Date(p.date).toLocaleDateString()}</p>
						<p>${p.summary}</p>
						<div class="tags">
							${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}
						</div>
					</div>
				`;
				grid.appendChild(card);
			});

			sectionsEl.appendChild(secEl);
		});
		if (!groups.length) {
			sectionsEl.innerHTML = `<div class="constitution-section" style="text-align:center;">No results. Try different dates or tags.</div>`;
		}
	}

	function applyFilters() {
		const q = document.getElementById("q").value.trim().toLowerCase();
		const tag = document.getElementById("tag").value;
		const from = document.getElementById("from").value;
		const to = document.getElementById("to").value;

		const out = POSTS.filter(p => {
			const qHit = !q || p.title.toLowerCase().includes(q) || p.summary.toLowerCase().includes(q);
			const tagHit = !tag || p.tags.includes(tag);
			const dateHit = (!from || p.date >= from) && (!to || p.date <= to);
			return qHit && tagHit && dateHit;
		});

		const info = document.getElementById("resultsInfo");
		info.hidden = false;
		info.textContent = `Showing ${out.length} of ${POSTS.length} entries`;
		renderSections(out);
	}

	document.getElementById("searchForm").addEventListener("submit", e => {
		e.preventDefault(); applyFilters();
	});
	document.getElementById("clearBtn").addEventListener("click", () => {
		document.getElementById("q").value = "";
		document.getElementById("tag").value = "";
		document.getElementById("from").value = "";
		document.getElementById("to").value = "";
		applyFilters();
	});
	window.addEventListener("keydown", e => {
		if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
			e.preventDefault(); document.getElementById("q").focus();
		}
	});

	applyFilters();
	</script>
</body>
</html>
